  <path d="M 50 22 C 68 22 80 32 82 44 L 58 60 L 50 60 Z" fill="url(#gc-shadow)" />
  <!-- Top Right Emerald Arch & Folded G-Crossbar -->
  <path d="M 50 0 L 100 22 C 100.5 32 100 42 98.5 50 L 68 50 L 48 50 C 42 50 39 53 39 57.5 C 39 62 42 65 48 65 L 75 65 C 80 65 85 62 88 57 L 98.5 50 C 98.5 50 94 34 81 26 C 72 20 62 21 50 22 Z" fill="url(#gc-top)" />
  <!-- Lower Right Emerald Stem -->
  <path d="M 50 115 C 82 92 98 78 100 68 L 78 68 C 76 77 70 87 50 96 Z" fill="url(#gc-bot)" />
</svg>
