<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- GigChain Official Favicon (128x128 canvas, optimized for 16px to 64px) -->
  <defs>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F1F3D" />
      <stop offset="100%" stop-color="#071124" />
    </linearGradient>
    <linearGradient id="fav-top" x1="64" y1="18" x2="108" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05A683" />
      <stop offset="55%" stop-color="#0BB892" />
      <stop offset="100%" stop-color="#14C49E" />
    </linearGradient>
    <linearGradient id="fav-bot" x1="64" y1="116" x2="108" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#55D1BA" />
      <stop offset="40%" stop-color="#24BEA2" />
      <stop offset="100%" stop-color="#0CAE90" />
    </linearGradient>
    <linearGradient id="fav-shadow" x1="72" y1="56" x2="90" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#063D34" />
      <stop offset="100%" stop-color="#0A4D42" />
    </linearGradient>
    <linearGradient id="fav-navy" x1="64" y1="18" x2="28" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22395D" />
      <stop offset="100%" stop-color="#101F36" />
    </linearGradient>
  </defs>

  <!-- High contrast rounded dark backdrop container -->
  <rect width="128" height="128" rx="28" fill="url(#fav-bg)" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#263E63" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Shield scaled to fit comfortably (scale ~0.85, centered at (64, 67)) -->
  <g transform="translate(21.5, 15) scale(0.85)">
    <!-- 1. Left Navy Shield Structure -->
    <path d="M 50 0 L 0 22 C -0.5 48 8 82 50 115 L 50 96 C 24 76 21 48 50 22 Z" fill="url(#fav-navy)" />
    <!-- 2. Shadow fold -->
    <path d="M 50 22 C 68 22 80 32 82 44 L 58 60 L 50 60 Z" fill="url(#fav-shadow)" />
    <!-- 3. Top-Right Emerald Arch + Folded G-Crossbar -->
    <path d="M 50 0 L 100 22 C 100.5 32 100 42 98.5 50 L 68 50 L 48 50 C 42 50 39 53 39 57.5 C 39 62 42 65 48 65 L 75 65 C 80 65 85 62 88 57 L 98.5 50 C 98.5 50 94 34 81 26 C 72 20 62 21 50 22 Z" fill="url(#fav-top)" />
    <!-- 4. Lower-Right Emerald Upright Stem -->
    <path d="M 50 115 C 82 92 98 78 100 68 L 78 68 C 76 77 70 87 50 96 Z" fill="url(#fav-bot)" />
  </g>
</svg>